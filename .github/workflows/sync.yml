name: Sincronizar datos de Secanuca

on:
  schedule:
    # Se ejecuta cada 5 minutos (es el mínimo que permite GitHub Actions de forma confiable)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite dispararlo manualmente desde la pestaña "Actions" de GitHub

jobs:
  sync:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de sincronización
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: node sync-promiedos.js

      - name: Persistir nuevos partidos en el CSV
        run: |
          if git diff --quiet -- src/data/referee-matches.csv; then
            echo "No hay partidos nuevos para persistir."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/referee-matches.csv
          git commit -m "Actualizar historial de partidos por árbitro"
          git push